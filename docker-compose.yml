services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: prism-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017" # Доступ до БД з хоста (за потреби)
    volumes:
      - mongo_data:/data/db
    networks:
      - prism-network

  # 2. Fastify Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: prism-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/prism-media-server
      - JWT_SECRET=your_super_secret_jwt_key_here
      - MEDIA_ROOT_DIRECTORY=/media
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - FFPROBE_PATH=/usr/bin/ffprobe
    volumes:
      # Папка медіа на хості монтується у контейнер
      - ./media:/media
    networks:
      - prism-network

  # 3. Nginx Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: prism-frontend
    restart: unless-stopped
    ports:
      - "80:80" # Фронтенд доступний на http://localhost:80 (або просто http://localhost)
    depends_on:
      - backend
    networks:
      - prism-network

volumes:
  mongo_data:

networks:
  prism-network:
    driver: bridge
